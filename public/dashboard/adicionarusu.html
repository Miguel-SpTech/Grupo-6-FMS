<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dash.css">
  <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="adicionarusuario">
  <aside class="sidebar">

        <div class="sidebar-logo">
 
    </div>
        
        <nav>
            <ul>
                       <ul>
      <li>
          <a href="dashboard.html">
              <i class="fa-solid fa-chart-line"></i>
              Dashboard
          </a>
      </li>

      <li>
          <a href="adicionarusu.html">
              <i class="fa-solid fa-user-plus"></i>
              Adicionar Usuário
          </a>
      </li>

       <li>
          <a href="solicitacao.html" id="solicitacaoCadastroNavbar" style="display: none;">
            <i class="fa-solid fa-eye"></i>
            Analisar Cadastro
          </a>
        </li>
                 <li>
          <a onclick="limparSessao()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Sair
          </a>
        </li>
            </ul>       
        </nav>
    </aside>
  <main>

        <div class="container">
      <h1>Monitoramento do restaurante</h1>


        <form class="formulario" id="formAdicionarUsuario">

        <h2>Adicionar Usuário</h2>

        <label>Nome</label>
        <input id="nomeUsuario" type="text" placeholder="Digite o nome" required>

        <label>Email</label>
        <input id="emailUsuario" type="email" placeholder="Digite o email" required>

        <label>Senha</label>
        <input id="senhaUsuario" type="password" placeholder="Digite a senha" required>

        <label>Tipo de usuário</label>
        <select id="cargoUsuario" required>
            <option value="Administrador">Administrador</option>
            <option value="Operador">Operador</option>
        </select>

        <div class="botoes">
        <button type="submit" id="btn_criaruser">
            <i class="fa-solid fa-user-plus"></i>
            Cadastrar
        </button>

        
        <button type="submit" id="btn_cancelar">
           <i class="fa-solid fa-xmark"></i>
            Cancelar
        </button>
        </div>


    </form>

        </div>

     
</main>
</body>
</html>

<script>
function limparSessao() {
    sessionStorage.clear();
    window.location = "../login.html";
}

  function configNavbar(){
    const cargo = (sessionStorage.getItem('CARGO_USUARIO') || '').trim();
    const solicitacaoCadastro = document.getElementById('solicitacaoCadastroNavbar');

    if (cargo === 'superAdmin') {
      solicitacaoCadastro.style.display = 'block';
    }
  }

 async function cadastrarUsuario(){

    const dados = {
      nomeUsuarioServer: nomeUsuario.value,
      emailServer: emailUsuario.value,
      senhaServer: senhaUsuario.value,
      cargoServer: cargoUsuario.value,
      fkRestaurante: Number(sessionStorage.getItem('RESTAURANTE_ID'))
    };
    await fetch('/usuarios/cadastrarDash', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    })

  }

  document.getElementById('formAdicionarUsuario').addEventListener('submit', function (event) {
    event.preventDefault();
    cadastrarUsuario();
  });
  configNavbar();
</script>
