<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FMS</title>
    <link rel="icon" href="assets/img/logoWhiteWOfms.png">
    <link rel="stylesheet" href="assets/styles/styleLogin.css">
</head>
<body>

    <header class="navbar">
      <div class="logo-icon">
        <img src="assets/img/logoWhiteWOfms.png" alt="">
      </div>
    <div class="navbar-links">
      <span><a href="index.html">Início</a></span>
      <span><a href="index.html#sobre">Sobre nós</a></span>
      <span><a href="index.html#faq">FAQ</a></span>
      <span><a href="calculadora.html">Simulação</a></span>
    </div>
    <button class="navbar-btn"><a href="cadastro.html">Cadastrar</a></button>
  </header>
  <div class="div_body">
        <div class="div_princ">
            <h2>Login</h2>
            <span id="spanEmail">e-mail</span>
            <input type="text" placeholder="email:" id="inp_email">
            <span>senha:</span>
            <input type="password" placeholder="senha:" id="inp_password">
            <div id="div_loginMsg"></div>
            <button type="button" id="btnentrar" onclick="login()">Entrar</button>
            <span id="loginSpan">Ainda não possui um cadastro? <a href="cadastro.html" id="loginA">Cadastrar</a></span>
        </div>
    <div class="container">
        <div class="login">
            <div class="header">
                
            </div>
            
        </div>
    </div>

    <script>
        function login() {
            const email = document.getElementById("inp_email").value.toLowerCase()
            const password = document.getElementById("inp_password").value
            const div_loginMsg = document.getElementById("div_loginMsg")

            if (!email || !password) {
                div_loginMsg.innerHTML = `<span class="verificacaoFalse">Preencha todos os campos.</span>`
                return
            }

            // Mostrar loading
            document.getElementById("btnentrar").disabled = true
            div_loginMsg.innerHTML = `<span class="verificacaoTrue">Autenticando...</span>`

            // Fazer requisição para a API
            fetch('/usuarios/autenticar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: password
                })
            })
            .then(response => {
                if (response.ok) {
                    return response.json()
                } else if (response.status === 403) {
                    throw new Error('Email e/ou senha inválido(s)')
                } else {
                    throw new Error('Erro ao conectar com o servidor')
                }
            })
            .then(data => {
                // Armazenar dados da sessão
                sessionStorage.setItem('ID_USUARIO', data.id)
                sessionStorage.setItem('EMAIL_USUARIO', data.email)
                sessionStorage.setItem('NOME_USUARIO', data.nome)
                sessionStorage.setItem('CARGO_USUARIO', data.cargo)
                sessionStorage.setItem('RESTAURANTE_ID', data.restaurante.id)
                sessionStorage.setItem('RESTAURANTE_NOME', data.restaurante.nome_fantasia)
                
                div_loginMsg.innerHTML = `<span class="verificacaoTrue">Login realizado com sucesso!</span>`
                
                // Redirecionar para o dashboard após 2 segundos
                setTimeout(() => {
                    window.location.href = "dashboard/dashboard.html"
                }, 2000)
            })
            .catch(err => {
                console.error('Erro:', err)
                div_loginMsg.innerHTML = `<span class="verificacaoFalse">${err.message}</span>`
                document.getElementById("btnentrar").disabled = false
            })
        }

        // Permitir login com Enter
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById("inp_password").addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    login()
                }
            })
        })
    </script>
</body>
</html>
