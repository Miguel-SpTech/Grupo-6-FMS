<script>



  async function buscarKpi() {
    // VOU MANDAR UM ID DE EMPRESA PLACEHOLDER ENQUANTO O LOGIN NAO FUNCIONA

    var resposta = await fetch("/kpi/buscarKpi/1");
    var Kpis = await resposta.json();

    rotatividademesa.innerHTML = Kpis.rotatividade
    kpiFluxoAtual.innerHTML = Kpis.fluxo[0]
    kpiFluxoMeta.innerHTML = Kpis.fluxo[1]
    kpiOcupacao.innerHTML = Kpis.ocupacao
  }
 
  
   async function carregarGrid(){


    const heatmap = document.querySelector('.heatmap');
    
   heatmap.innerHTML = "";

  for(let i = 0; i < 144; i++) {
      const div = document.createElement('div');
      div.classList.add('cell');
    heatmap.appendChild(div);
}

 
   }
    

      async function carregarHeatmap() {
  const res = await fetch("http://localhost:3333/heatmap/1");
  const dados = await res.json();

  const cells = document.querySelectorAll('.cell');

  dados.forEach((registro) => {

    const bloco = registro.bloco; 
    const valor = Number(registro.total_movimentacoes);

    // pega célula pelo índice do bloco
    const index = parseInt(bloco) - 1;
    const cell = cells[index];

    if (!cell) return;

    
    if (valor < 10) {
      if (valor <= 3) {
        cell.style.backgroundColor = "rgba(255,255,0,0.3)";
      } else if (valor <=6) {
        cell.style.backgroundColor = "rgba(255,255,0,0.6)";
      } else {
        cell.style.backgroundColor = "rgba(255,255,0,0.9)";
      }

    
    } else if (valor < 20) {
      if (valor <= 13) {
        cell.style.backgroundColor = "rgba(255,165,0,0.3)";
      } else if (valor <= 16) {
        cell.style.backgroundColor = "rgba(255,165,0,0.6)";
      } else {
        cell.style.backgroundColor = "rgba(255,165,0,0.9)";
      }

    
    } else {
      if (valor <= 23) {
        cell.style.backgroundColor = "rgba(255,0,0,0.3)";
      } else if (valor <= 26) {
        cell.style.backgroundColor = "rgba(255,0,0,0.6)";
      } else {
        cell.style.backgroundColor = "rgba(255,0,0,0.9)";
      }
    }
    console.log(registro.total_movimentacoes);
  });
}
