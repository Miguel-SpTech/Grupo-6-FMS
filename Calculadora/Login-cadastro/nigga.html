<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="https://github.com/Miguel-SpTech/Grupo-6-FMS/blob/main/Calculadora/Login-cadastro/logoWhiteWOfms.png?raw=true">
    <style>
        .verificacaoTrue { color: #15fc40; }
        .verificacaoFalse { color: #f52626; }
        .text1 { font-size: 15px; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-image: url("https://github.com/Miguel-SpTech/Grupo-6-FMS/blob/main/Calculadora/Login-cadastro/Login.png?raw=true");
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 100px);
        }

        .navbar {
            background-color: #982829;
            width: 80%;
            margin: 20px auto;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .header {
            font-weight: bold;
        }

        .login {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 350px;
            background: #ffff;
            align-items: center;
            padding: 20px;
            border-radius: 20px;
        }

        .login input {
            margin-top: 0px;
            border-radius: 30px;
            width: 250px;
            height: 30px;
            border: 2px solid black;
        }

        .login input::placeholder {
            font-weight: bold;
            font-size: 15px;
        }

        .login span { gap: 30px; }

        .logoTop {
            height: 50px;
            width: 90px;
            margin-left: 13px;
            margin-top: 3px;
        }

        .menu {
            list-style: none;
            display: flex;
            gap: 160px;
            margin: 0;
            padding: 0;
            align-items: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        .menu a {
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            color: white;
        }

        #cadastro-btn {
            background-color: #E4B97E;
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            width: 130px;
            height: 55px;
            font-size: 20px;
        }

        #btnentrar {
            background-color: #620808;
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            width: 250px;
            height: 50px;
            font-size: 20px;
            color: white;
        }

        #btnentrar:hover {
            background-color: #982829;
            transition: background-color 0.2s;
        }

        .link-cadastro {
            font-size: 13px;
            color: #620808;
            text-decoration: none;
            font-weight: bold;
        }

        .link-cadastro:hover {
            text-decoration: underline;
        }

        #div_loginMsg {
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <img class="logoTop" src="https://github.com/Miguel-SpTech/Grupo-6-FMS/blob/main/Calculadora/Login-cadastro/logoWhiteWOfms.png?raw=true" alt="">
        <ul class="menu">
            <li><a href="#">Início</a></li>
            <li><a href="#">Sobre nós</a></li>
            <li><a href="#">FAQ</a></li>
            <li><a href="#">Simulação</a></li>
        </ul>
        <a href="cadastro.html">
            <button type="button" id="cadastro-btn">Cadastro</button>
        </a>
    </div>

    <div class="container">
        <div class="login">
            <div class="header">
                <h2>Login</h2>
            </div>
            <input type="text" placeholder="email:" id="inp_email"><br>
            <input type="password" placeholder="senha:" id="inp_password">
            <br>
            <div id="div_loginMsg"></div>
            <button type="button" id="btnentrar" onclick="login()">Entrar</button>
            <a href="cadastro.html" class="link-cadastro">Não tem conta? Cadastre-se</a>
        </div>
    </div>

    <script>
        function login() {
            const email = document.getElementById("inp_email").value.toLowerCase()
            const password = document.getElementById("inp_password").value
            const div_loginMsg = document.getElementById("div_loginMsg")

            if (!email || !password) {
                div_loginMsg.innerHTML = `<span class="verificacaoFalse">Preencha todos os campos.</span>`
                return
            }

            try {
                const data = localStorage.getItem(email)
                if (password === data){
                    div_loginMsg.innerHTML=`<span class="verificacaoTrue">Login realizado com sucesso!</span>`
                }
                else{
                    div_loginMsg.innerHTML = `<span class="verificacaoFalse">Erro ao conectar</span>`
                }

            } catch (err) {
                div_loginMsg.innerHTML = `<span class="verificacaoFalse">Erro ao conectar</span>`
                console.error(err)
            }
        }
    </script>
</body>
</html>
