<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Dashboard</h1>

    <div class="kpis">
      <div class="card">
        <h2> Pessoas / Mês</h2>
        <p class="green" id="faturamento"></p>
      </div>

      <div class="card">
        <h2>Vendas</h2>
        <p class="blue">320</p>
      </div>

      <div class="card">
        <h2>Conversão</h2>
        <p class="red">3.2%</p>
      </div>
    </div>

    <div class="charts">
      <div class="chart"><canvas id="barChart"></canvas></div>
      <div class="chart">Gráfico de Receita</div>
    </div>

  </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="dashboard.js"></script>
</html>
