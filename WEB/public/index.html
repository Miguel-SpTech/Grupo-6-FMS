<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Dashboard FMS</h1>

    <div class="kpis">
      <div class="card">
        <h2>Últimos 7 Dias</h2>
        <p class="red" id="lastweek"></p>
      </div>

      <div class="card">
        <h2>Ultimo Mês</h2>
        <p class="red" id="lastmonth">320</p>
      </div>

      <div class="card">
        <h2>Ideal</h2>
        <p class="red">1750</p>
      </div>
    </div>

    <div class="charts">
      <div class="chart"><canvas id="barChart"></canvas></div>
      <div class="chart">Gráfico de Receita</div>
    </div>

  </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="dashboard.js"></script>
</html>
