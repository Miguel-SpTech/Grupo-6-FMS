    function verificarEmail() {
        var email = inp_email.value.toLowerCase();
        inp_email.value = email;
        let local_arroba = email.indexOf("@");
        let local_ponto_com = email.indexOf(".com");
        let end_ponto_com = email.endsWith(".com");
        let end_ponto_com_br = email.endsWith(".com.br");
        let localVerification = local_arroba < local_ponto_com;
        var end_verification_email = end_ponto_com || end_ponto_com_br && localVerification;

        if (end_verification_email) {
            div_emailVerification.innerHTML = `<span class="text1 verificacaoTrue">E-mail valido!</span>`
        } else {
            div_emailVerification.innerHTML = `<span class="text1 verificacaoFalse">E-mail Invalido.</span>`
        }
        return end_verification_email;
    }
