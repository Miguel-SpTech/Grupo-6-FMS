<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" href="assets/img/logoWhiteWOfms.png">
    <link rel="stylesheet" href="assets/styles/styleCadastro.css">
</head>
<body>
    <header class="navbar">
      <div class="logo-icon">
        <img src="assets/img/logoWhiteWOfms.png" alt="">
      </div>
    <div class="navbar-links">
      <span><a href="main.html">Início</a></span>
      <span><a href="main.html#sobre">Sobre nós</a></span>
      <span><a href="main.html#faq">FAQ</a></span>
      <span><a href="calculadora.html">Simulação</a></span>
    </div>
    <button class="navbar-btn"><a href="login.html">Login</a></button>
  </header>
  
<div class="container">
     <div class="login">
        <div class="header">
            <h2>Cadastro</h2>
            </div>
    <input type="text" placeholder="email:" id="inp_email" oninput="verificarEmail()"><br>
    <div id="div_emailVerification"></div>
    <input type="password" placeholder="senha:" id="inp_password" oninput="verificarPsswrd()">
    <div id="div_passwordVerification">
        <span>a senha precisa ter no mínimo:</span><br>
        <span id="span_psswrdCaracteres">6 caracteres</span><br>
        <span id="span_psswrdNumber">1 número</span><br>
        <span id="span_psswrdUpper">1 letra MAIUSCULA</span><br>
        <span id="span_psswrdLower">1 letra MINUSCULA</span>
    </div>
    <input type="password" placeholder="confirmar senha:" id="inp_password2" oninput="verificarPsswrd()">
    <div id="div_passwrd_confirmation"></div>
    <br>
    <button class="btn" type="button" id="btnentrar" onclick="cadastrar()">Cadastrar</button>
      </div>
      
     </div>
    <div id="div_cadastro"></div>
</body>
</html>
<script>
    let emails_cadastrados = [];
    let passwords_cadastrados = [];
    function verificarEmail() {
        var email = inp_email.value.toLowerCase();
        inp_email.value = email;
        let local_arroba = email.indexOf("@");
        let local_ponto_com = email.indexOf(".com");
        let end_ponto_com = email.endsWith(".com");
        let end_ponto_com_br = email.endsWith(".com.br");
        let localVerification = local_arroba < local_ponto_com;
        var end_verification_email = end_ponto_com || end_ponto_com_br && localVerification;

        if (end_verification_email) {
            div_emailVerification.innerHTML = `<span class="text1 verificacaoTrue">E-mail valido!</span>`
        } else {
            div_emailVerification.innerHTML = `<span class="text1 verificacaoFalse">E-mail Invalido.</span>`
        }
        return end_verification_email;
    }
    function verificarPsswrd() {
        let password = inp_password.value;
        let password2 = inp_password2.value;
        let regex_tem_numero = new RegExp("[0-9]"); 
        let regex_tem_letra = new RegExp("[A-Z]");
        let regex_tem_letra2 = new RegExp("[a-z]");
        let psswrd_confirmation = password == password2;
        var end_verification_psswrd = false;
        let passwordLength = password.length;

        if (regex_tem_numero.test(password)){
            span_psswrdNumber.innerHTML = `<span class = "verificacaoTrue">1 Número</span>`
            end_verification_psswrd = true;
        } else {
            span_psswrdNumber.innerHTML = `<span class = "verificacaoFalse">1 Número</span>`
            end_verification_psswrd = false;
        }
        if (regex_tem_letra2.test(password)) {
            span_psswrdLower.innerHTML = `<span class = "verificacaoTrue">1 letra MINUSCULA</span>`
            end_verification_psswrd = true;
        } else {
            span_psswrdLower.innerHTML = `<span class = "verificacaoFalse">1 letra MINUSCULA</span>`
            end_verification_psswrd = false;
        }
        if (regex_tem_letra.test(password)) {
            span_psswrdUpper.innerHTML = `<span class = "verificacaoTrue">1 letra MAIUSCULA</span>`
            end_verification_psswrd = true;
        } else {
            span_psswrdUpper.innerHTML = `<span class = "verificacaoFalse">1 letra MAIUSCULA</span>`
            end_verification_psswrd = false;
        }
        if (passwordLength >= 6) {
            span_psswrdCaracteres.innerHTML = `<span class = "verificacaoTrue">6 caracteres</span>`
            end_verification_psswrd = true;
        } else {
            span_psswrdCaracteres.innerHTML = `<span class = "verificacaoFalse">6 caracteres</span>`
            end_verification_psswrd = false;
        }
        if (psswrd_confirmation) {
            end_verification_psswrd = true;
            div_passwrd_confirmation.innerHTML = ``
        } else {
            end_verification_psswrd = false;
            div_passwrd_confirmation.innerHTML = `<span>Senhas não correspondentes.</span>`;
        }

        return end_verification_psswrd;
    }
    function cadastrar() {
        var email = inp_email.value.toLowerCase();
        let password = inp_password.value
        let not_cadastrado = true;
        
            if (not_cadastrado){
                if (verificarEmail() && verificarPsswrd()) {
                        emails_cadastrados.push(email);
                        passwords_cadastrados.push(password);
                        localStorage.setItem(email, password)
                        
                    
                } else {
                    alert("E-mail ou Senha invalidos. Insira-os novamente.");
                }}
            for (let i = 0; i < emails_cadastrados.length; i++) {
                for (let j = i + 1 ; j < emails_cadastrados.length ; j++) {
                    if (emails_cadastrados[i] == emails_cadastrados[j]) {
                        not_cadastrado = false;
                        alert("E-mail já cadastrado!");
                    } else {
                        not_cadastrado = true;
                    }
                }
                if (!not_cadastrado) {
                    div_emailVerification.innerHTML = `<span class="text1 verificacaoFalse">E-mail já cadastrado</span>`;
                    emails_cadastrados.pop();
                    passwords_cadastrados.pop();
                break
                } else {
                    alert("E-mail cadastrado com sucesso!");

                    setTimeout(window.location.href="login.html",4000)
                }
                }
        console.log(emails_cadastrados);
        console.log(passwords_cadastrados);
        
    
    }
</script>
